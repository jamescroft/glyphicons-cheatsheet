<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-in { animation: slideIn 0.3s ease-out; }
        /* Feather icons centering */
        .text-4xl svg.feather {
            width: 2.5rem;
            height: 2.5rem;
            margin: 0 auto;
            display: block;
        }
        /* Octicons SVG centering */
        .text-4xl svg.octicon {
            width: 2.5rem;
            height: 2.5rem;
            margin: 0 auto;
            display: block;
            fill: currentColor;
        }
        /* Anchor link visibility on section header hover */
        .section-header:hover .anchor-link {
            opacity: 1;
        }
        .anchor-link {
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        .anchor-link:hover, .anchor-link:focus {
            opacity: 1;
        }
        /* Copied feedback animation */
        @keyframes linkCopied {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
        .anchor-link.copied .anchor-icon {
            animation: linkCopied 0.3s ease;
        }
        .load-more-btn {
            background: transparent;
            border: 1px dashed rgba(15, 23, 42, 0.25);
            color: #475569;
        }
        .load-more-btn:hover {
            border-color: rgba(15, 23, 42, 0.4);
            background: rgba(15, 23, 42, 0.04);
        }
        .load-more-btn.loading {
            background: rgba(15, 23, 42, 0.06);
            border-color: rgba(15, 23, 42, 0.5);
            color: #0f172a;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
            transform: translateY(-2px);
        }
        .load-more-hint {
            font-size: 0.75rem;
            color: #64748b;
            margin-top: 0.25rem;
        }
        .load-more-spinner {
            width: 14px;
            height: 14px;
            border: 2px solid rgba(15, 23, 42, 0.2);
            border-top-color: rgba(15, 23, 42, 0.6);
            border-radius: 9999px;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>

        function formatFa4Name(className) {
            const raw = className.replace(/^fa-/, '');
            return raw.split('-').map(part => part ? part[0].toUpperCase() + part.slice(1) : part).join(' ');
        }

        async function loadFontAwesome4Icons() {
            if (fa4IconsLoaded || fa4IconsLoading) return;
            fa4IconsLoading = true;
            try {
                const response = await fetch(fa4IconsSource);
                if (!response.ok) throw new Error(`Failed to fetch FA4 icons: ${response.status}`);
                const data = await response.json();
                const icons = Array.isArray(data['4.7.0']) ? data['4.7.0'] : [];
                const uniqueIcons = Array.from(new Set(icons)).sort();
                const items = uniqueIcons.map((className) => ({
                    name: formatFa4Name(className),
                    code: `<i class="fa ${className}"></i>`,
                    icon: `fa ${className}`,
                    description: className
                }));
                if (iconsData.fontawesome?.versions?.['4']?.categories?.examples) {
                    iconsData.fontawesome.versions['4'].categories.examples.items = items;
                }
                fa4IconsLoaded = true;
            } catch (error) {
                console.warn('Failed to load Font Awesome 4 icons list.', error);
            } finally {
                fa4IconsLoading = false;
            }
        }

        function formatFa5StyleLabel(style) {
            if (!style) return '';
            return style.charAt(0).toUpperCase() + style.slice(1);
        }

        function startFontAwesomeChunkedBuild(versionKey, icons) {
            const category = iconsData.fontawesome?.versions?.[versionKey]?.categories?.examples;
            if (!category) return;

            category.items = [];
            category._rawIcons = icons;
            category._rawIndex = 0;
            category._itemsReady = false;
            category._itemsLoading = true;
            category._hasRenderedOnce = false;

            const batchSize = 200;

            const buildBatch = () => {
                const start = category._rawIndex;
                const end = Math.min(start + batchSize, category._rawIcons.length);

                for (let i = start; i < end; i += 1) {
                    const icon = category._rawIcons[i];
                    const styles = icon?.familyStylesByLicense?.free || [];
                    styles.forEach((style) => {
                        const prefix = style?.prefix;
                        if (!prefix) return;
                        const styleLabel = formatFa5StyleLabel(style?.style);
                        const displayName = styleLabel ? `${icon.label} (${styleLabel})` : icon.label;
                        const className = `${prefix} fa-${icon.id}`;
                        category.items.push({
                            name: displayName,
                            code: `<i class="${className}"></i>`,
                            icon: className,
                            description: icon.id
                        });
                    });
                }

                category._rawIndex = end;

                if (currentMode === 'icons' && currentIconLibrary === 'fontawesome' && currentFontAwesomeVersion === versionKey && currentCategory === 'examples') {
                    if (!category._hasRenderedOnce && category.items.length > 0) {
                        category._hasRenderedOnce = true;
                        renderContent();
                    }
                }

                if (category._rawIndex < category._rawIcons.length) {
                    setTimeout(buildBatch, 0);
                } else {
                    category._itemsReady = true;
                    category._itemsLoading = false;
                    if (versionKey === '7') {
                        fa7IconsLoaded = true;
                        fa7IconsLoading = false;
                    }
                    if (versionKey === '6') {
                        fa6IconsLoaded = true;
                        fa6IconsLoading = false;
                    }
                    if (versionKey === '5') {
                        fa5IconsLoaded = true;
                        fa5IconsLoading = false;
                    }
                    if (currentMode === 'icons' && currentIconLibrary === 'fontawesome' && currentFontAwesomeVersion === versionKey && currentCategory === 'examples') {
                        renderContent();
                    }
                }
            };

            buildBatch();
        }

                                id
                                label
                                familyStylesByLicense {
                                    free {
                                        prefix
                                        style

                            }

                const response = await fetch(fa5IconsEndpoint, {

        // Render sidebar categories based on current mode
        function renderSidebar() {
            const categories = currentMode === 'icons' ? iconsCategories : classesCategories;
            const nav = document.getElementById('category-nav');
            const activeColor = currentMode === 'icons' ? iconLibraryColors[currentIconLibrary] : versionColors[currentVersion];

            // Check if current category is a child of a parent
            function isChildActive(cat) {
                if (!cat.children) return false;
                return cat.children.some(child => child.id === currentCategory);
            }

            nav.innerHTML = categories.map((cat, index) => {
                const isActive = cat.id === currentCategory;
                const hasActiveChild = isChildActive(cat);
                const isExpanded = expandedCategories[cat.id] || false;

                if (cat.isParent && cat.children) {
                    // Parent category with children
                    const parentClass = hasActiveChild
                        ? `parent-btn w-full flex items-center gap-3 px-4 py-3 rounded-lg transition-all bg-slate-100 text-slate-900`
                        : 'parent-btn w-full flex items-center gap-3 px-4 py-3 rounded-lg transition-all text-slate-700 hover:bg-slate-50';

                    const childrenHtml = isExpanded ? cat.children.map(child => {
                        const isChildActive = child.id === currentCategory;
                        const childClass = isChildActive
                            ? `category-btn w-full flex items-center gap-3 pl-10 pr-4 py-2 rounded-lg transition-all ${activeColor} text-white shadow-md text-sm`
                            : 'category-btn w-full flex items-center gap-3 pl-10 pr-4 py-2 rounded-lg transition-all text-slate-600 hover:bg-slate-50 text-sm';

                        return `

                    return `

        // Helper function to escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Copy to clipboard
        function copyToClipboard(text, button) {
            navigator.clipboard.writeText(text).then(() => {
                const originalText = button.textContent;
                button.textContent = 'Copied!';
                button.classList.add('bg-green-100');
                setTimeout(() => {
                    button.textContent = originalText;
                    button.classList.remove('bg-green-100');
                }, 2000);
            });
        }

        // Cache for Octicons SVGs
        const octiconsCache = {};

        // Load Octicons SVGs from CDN
        async function loadOcticonsSVGs() {
            const placeholders = document.querySelectorAll('.octicon-placeholder[data-octicon]');

            for (const placeholder of placeholders) {
                const iconName = placeholder.getAttribute('data-octicon');
                if (!iconName || iconName === 'undefined') continue;

                try {
                    let svgContent;
                    if (octiconsCache[iconName]) {
                        svgContent = octiconsCache[iconName];
                    } else {
                        const response = await fetch(`https://unpkg.com/@primer/octicons@19.8.0/build/svg/${iconName}-16.svg`);
                        if (response.ok) {
                            svgContent = await response.text();
                            octiconsCache[iconName] = svgContent;
                        }
                    }

                    if (svgContent) {
                        const wrapper = document.createElement('div');
                        wrapper.innerHTML = svgContent;
                        const svg = wrapper.querySelector('svg');
                        if (svg) {
                            svg.classList.add('octicon');
                            placeholder.replaceWith(svg);
                        }
                    }
                } catch (error) {
                    console.warn(`Failed to load octicon: ${iconName}`, error);
                }
            }
        }

        // Search function - returns matching items across all categories
        function performSearch(query) {
            const results = [];
            const lowerQuery = query.toLowerCase();

            if (currentMode === 'icons' && currentCategory === 'examples') {
                // When on Examples category, only search within examples (icon names and descriptions)
                const libraryData = getCurrentIconLibraryData();
                if (currentIconLibrary === 'fontawesome' && currentFontAwesomeVersion === '7' && !fa7IconsLoaded) {
                    loadFontAwesome7Icons().then(() => {
                        if (searchQuery.length > 0) {
                            const updatedResults = performSearch(searchQuery);
                            if (currentMode === 'icons' && currentCategory === 'examples') {
                                renderFilteredExamples(updatedResults);
                            } else {
                                renderSearchResults(updatedResults);
                            }
                        }
                    });
                    return results;
                }
                if (currentIconLibrary === 'fontawesome' && currentFontAwesomeVersion === '6' && !fa6IconsLoaded) {
                    loadFontAwesome6Icons().then(() => {
                        if (searchQuery.length > 0) {
                            const updatedResults = performSearch(searchQuery);
                            if (currentMode === 'icons' && currentCategory === 'examples') {
                                renderFilteredExamples(updatedResults);
                            } else {
                                renderSearchResults(updatedResults);
                            }
                        }
                    });
                    return results;
                }
                if (currentIconLibrary === 'fontawesome' && currentFontAwesomeVersion === '5' && !fa5IconsLoaded) {
                    loadFontAwesome5Icons().then(() => {
                        if (searchQuery.length > 0) {
                            const updatedResults = performSearch(searchQuery);
                            if (currentMode === 'icons' && currentCategory === 'examples') {
                                renderFilteredExamples(updatedResults);
                            } else {
                                renderSearchResults(updatedResults);
                            }
                        }
                    });
                    return results;
                }
                if (currentIconLibrary === 'fontawesome' && currentFontAwesomeVersion === '4' && !fa4IconsLoaded) {
                    loadFontAwesome4Icons().then(() => {
                        if (searchQuery.length > 0) {
                            const updatedResults = performSearch(searchQuery);
                            if (currentMode === 'icons' && currentCategory === 'examples') {
                                renderFilteredExamples(updatedResults);
                            } else {
                                renderSearchResults(updatedResults);
                            }
                        }
                    });
                    return results;
                }
                const examplesCategory = libraryData.categories['examples'];
                examplesCategory.items.forEach(item => {
                    if (item.name.toLowerCase().includes(lowerQuery) ||
                        item.description.toLowerCase().includes(lowerQuery)) {
                        results.push({ ...item, categoryId: 'examples', categoryTitle: examplesCategory.title });
                    }
                });
            } else if (currentMode === 'icons') {
                // Search through all iconsData categories for current library
                const libraryData = getCurrentIconLibraryData();
                Object.entries(libraryData.categories).forEach(([categoryId, category]) => {
                    category.items.forEach(item => {
                        if (item.name.toLowerCase().includes(lowerQuery) ||
                            item.description.toLowerCase().includes(lowerQuery) ||
                            item.code.toLowerCase().includes(lowerQuery)) {
                            results.push({ ...item, categoryId, categoryTitle: category.title });
                        }
                    });
                });
            } else {
                // Search through contentData for current version
                const versionData = contentData[currentVersion] || {};
                Object.entries(versionData).forEach(([categoryId, category]) => {
                    category.items.forEach(item => {
                        if (item.name.toLowerCase().includes(lowerQuery) ||
                            item.description.toLowerCase().includes(lowerQuery) ||
                            item.code.toLowerCase().includes(lowerQuery)) {
                            results.push({ ...item, categoryId, categoryTitle: category.title });
                        }
                    });
                });
            }

            return results;
        }

        // Render search results
        function renderSearchResults(results) {
            const container = document.getElementById('content-container');
            document.getElementById('content-title').textContent = `Search Results (${results.length})`;

            if (results.length === 0) {
                container.innerHTML = `

            // Check if we're in icons mode and results contain icon examples
            const hasIconExamples = currentMode === 'icons' && results.some(item => item.icon);

            if (hasIconExamples && results.every(item => item.icon)) {
                // All results are icon examples - use grid layout
                container.innerHTML = `
                    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-4">

                                    Copy
                                </button>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else {
                // Mixed results or non-icon results - use list layout
                container.innerHTML = results.map((item, index) => `
                    <div class="border-2 border-slate-100 rounded-lg p-5 hover:border-purple-200 hover:shadow-md transition-all animate-slide-in">
                        <div class="flex items-start justify-between mb-2">
                            <div>
                                ${item.icon ? `<span class="text-2xl mr-2"><i class="bi ${item.icon}"></i></span>` : ''}
                                <h3 class="text-lg font-semibold text-slate-900 inline">${item.name}</h3>
                                <span class="ml-2 text-xs px-2 py-0.5 bg-slate-100 text-slate-600 rounded">${item.categoryTitle}</span>
                            </div>
                            <button data-code="${escapeHtml(item.code)}" class="search-copy-btn text-sm px-3 py-1 bg-slate-100 hover:bg-slate-200 rounded-md transition-colors">
                                Copy

                        <p class="text-sm text-slate-600 mb-3">${item.description}</p>
                        <pre class="bg-slate-900 text-slate-100 p-4 rounded-lg overflow-x-auto"><code class="text-sm">${escapeHtml(item.code)}</code></pre>
                    </div>
                `).join('');
            }

            // Attach event listeners to search result copy buttons
            document.querySelectorAll('.search-copy-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const code = this.getAttribute('data-code');
                    copyToClipboard(code, this);
                });
            });
        }

        // Render filtered examples (when searching within Examples category)
        function renderFilteredExamples(results) {
            const container = document.getElementById('content-container');
            const libraryData = getCurrentIconLibraryData();
            document.getElementById('content-title').textContent = results.length === libraryData.categories['examples'].items.length
                ? 'Icons'
                : `Icons (${results.length} found)`;

            if (results.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 text-slate-500">

            if (currentIconLibrary === 'fontawesome' && currentFontAwesomeVersion === '7' && !fa7IconsLoaded) {
                container.insertAdjacentHTML('afterbegin', `

            if (currentIconLibrary === 'fontawesome' && currentFontAwesomeVersion === '6' && !fa6IconsLoaded) {
                container.insertAdjacentHTML('afterbegin', `
                    <div class="mb-4 rounded-lg border border-blue-100 bg-blue-50 px-4 py-3 text-sm text-blue-700">
                        Loading more Font Awesome 6 icons in the background…
                    </div>
                `);
            }

            // Sort results alphabetically by name
            const sortedResults = [...results].sort((a, b) => a.name.localeCompare(b.name));
            const isLimited = sortedResults.length > iconExampleLimit;
            const displayResults = isLimited ? sortedResults.slice(0, iconExampleLimit) : sortedResults;

            const hoverColor = {
                'bootstrap': 'hover:border-pink-200',
                'fontawesome': 'hover:border-blue-200',
                'feather': 'hover:border-cyan-200',
                'octicons': 'hover:border-slate-300'
            }[currentIconLibrary];
            const btnColor = {
                'bootstrap': 'bg-pink-100 hover:bg-pink-200 text-pink-700',
                'fontawesome': 'bg-blue-100 hover:bg-blue-200 text-blue-700',
                'feather': 'bg-cyan-100 hover:bg-cyan-200 text-cyan-700',
                'octicons': 'bg-slate-200 hover:bg-slate-300 text-slate-700'
            }[currentIconLibrary];

            // Generate icon HTML based on library
            function renderIconPreview(item) {
                switch (currentIconLibrary) {
                    case 'bootstrap':
                        return `<i class="bi ${item.icon}"></i>`;
                    case 'fontawesome':
                        return `<i class="${item.icon}"></i>`;
                    case 'feather':
                        return `<i data-feather="${item.icon}"></i>`;
                    case 'octicons':
                        return `<span class="octicon-placeholder" data-octicon="${item.icon}"></span>`;
                    default:
                        return `<i class="${item.icon}"></i>`;
                }
            }

            container.innerHTML = `
                <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-4">
                    ${displayResults.map((item, index) => `
                        <div class="border-2 border-slate-100 rounded-lg p-4 ${hoverColor} hover:shadow-md transition-all animate-slide-in text-center flex flex-col h-full">

                                ${renderIconPreview(item)}
                            </div>
                            <h3 class="text-sm font-semibold text-slate-900 mb-1">${item.name}</h3>
                            <p class="text-xs text-slate-500 mb-3 flex-grow">${item.description}</p>
                            <button data-code="${escapeHtml(item.code)}" class="search-copy-btn text-xs px-3 py-1.5 ${btnColor} rounded-md transition-colors w-full mt-auto">

                </div>
                ${isLimited ? `
                <div class="mt-6 flex flex-col items-center justify-center text-center gap-2">
                        <button id="load-more-icons" class="load-more-btn px-4 py-2 rounded-lg text-sm font-semibold transition-colors inline-flex items-center gap-2">

                            <span class="load-more-text">Loading next batch…</span>

            // Initialize Feather icons if needed
            if (currentIconLibrary === 'feather' && typeof feather !== 'undefined') {
                feather.replace();

            // Load Octicons SVGs if needed
            if (currentIconLibrary === 'octicons') {
                loadOcticonsSVGs();

            // Attach event listeners to copy buttons
            document.querySelectorAll('.search-copy-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const code = this.getAttribute('data-code');
                    copyToClipboard(code, this);

            const loadMoreBtn = document.getElementById('load-more-icons');
            if (loadMoreBtn) {
                loadMoreBtn.addEventListener('click', () => {
                    if (autoLoadInProgress) return;
                    autoLoadInProgress = true;
                    iconExampleLimit += iconExampleStep;
                    renderFilteredExamples(results);
                });
                setupAutoLoadMore(loadMoreBtn, () => {
                    iconExampleLimit += iconExampleStep;
                    renderFilteredExamples(results);
                });
            }
            autoLoadInProgress = false;
        }

        // Clear search helper
        function clearSearch() {
            searchQuery = '';
            const searchInput = document.getElementById('search-input');
            if (searchInput) searchInput.value = '';
        }

        function setupAutoLoadMore(target, onLoadMore) {
            if (loadMoreObserver) {
                loadMoreObserver.disconnect();
                loadMoreObserver = null;
            }

            const triggerLoadMore = () => {
                if (autoLoadInProgress) return;
                autoLoadInProgress = true;
                if (target) {
                    target.classList.add('loading');
                    const text = target.querySelector('.load-more-text');
                    if (text) text.textContent = 'Loading next batch…';
                }
                setTimeout(() => {
                    onLoadMore();
                }, 1000);
            };

            if ('IntersectionObserver' in window) {
                loadMoreObserver = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            triggerLoadMore();
                        }
                    });
                }, { root: null, rootMargin: '200px 0px', threshold: 0.01 });
                loadMoreObserver.observe(target);
            } else {
                const handler = () => {
                    const rect = target.getBoundingClientRect();
                    if (rect.top <= window.innerHeight + 200) {
                        window.removeEventListener('scroll', handler);
                        triggerLoadMore();
                    }
                };
                window.addEventListener('scroll', handler, { passive: true });
                handler();
            }
        }

                renderSidebar();

        // Icon library selector
        document.querySelectorAll('.library-btn').forEach(btn => {
            btn.addEventListener('click', () => {

                });
                const color = iconLibraryColors[currentIconLibrary];
                btn.className = `library-btn p-4 rounded-xl border-2 transition-all font-medium ${color} text-white border-transparent shadow-lg scale-105`;
                if (currentIconLibrary === 'fontawesome') {
                    currentFontAwesomeVersion = (iconsData.fontawesome && iconsData.fontawesome.defaultVersion) ? iconsData.fontawesome.defaultVersion : '6';

                updateFontAwesomeVersionSelectorVisibility();

        // Font Awesome version selector
        document.querySelectorAll('.fa-version-btn').forEach(btn => {
            btn.addEventListener('click', () => {

                iconExampleLimit = 200;

                updateFontAwesomeStylesheet();
                if (currentIconLibrary === 'fontawesome' && currentFontAwesomeVersion === '7') {
                    loadFontAwesome7Icons().then(() => {
                        if (currentMode === 'icons' && currentIconLibrary === 'fontawesome' && currentFontAwesomeVersion === '7') {
                            renderSidebar();
                            renderContent();

                }
                if (currentIconLibrary === 'fontawesome' && currentFontAwesomeVersion === '6') {
                    loadFontAwesome6Icons().then(() => {
                        if (currentMode === 'icons' && currentIconLibrary === 'fontawesome' && currentFontAwesomeVersion === '6') {
                            renderSidebar();
                            renderContent();
                        }
                    });
                }
                if (currentIconLibrary === 'fontawesome' && currentFontAwesomeVersion === '5') {
                    loadFontAwesome5Icons().then(() => {
                        if (currentMode === 'icons' && currentIconLibrary === 'fontawesome' && currentFontAwesomeVersion === '5') {
                            renderSidebar();
                            renderContent();
                        }
                    });
                }
                if (currentIconLibrary === 'fontawesome' && currentFontAwesomeVersion === '4') {
                    loadFontAwesome4Icons().then(() => {
                        if (currentMode === 'icons' && currentIconLibrary === 'fontawesome' && currentFontAwesomeVersion === '4') {
                            renderSidebar();
                            renderContent();
                        }
                    });
                }
                renderSidebar();
                renderContent();
            });
        });

        // Mobile menu toggle
        document.getElementById('mobile-menu-btn').addEventListener('click', () => {
            const sidebar = document.getElementById('sidebar');
            const menuIcon = document.getElementById('menu-icon');
            const closeIcon = document.getElementById('close-icon');

            sidebar.classList.toggle('hidden');
            menuIcon.classList.toggle('hidden');
            closeIcon.classList.toggle('hidden');
        });

        // Search input handler
        document.getElementById('search-input').addEventListener('input', (e) => {
            searchQuery = e.target.value.trim();

            if (searchQuery.length > 0) {
                const results = performSearch(searchQuery);

                // When on Examples category, keep category selected and show filtered results
                if (currentMode === 'icons' && currentCategory === 'examples') {
                    renderFilteredExamples(results);
                } else {
                    renderSearchResults(results);
                    // Deselect current category in sidebar
                    document.querySelectorAll('.category-btn').forEach(b => {
                        b.className = 'category-btn w-full flex items-center gap-3 px-4 py-3 rounded-lg transition-all text-slate-700 hover:bg-slate-50';
                    });
                }
            } else {
                // Clear search, restore normal view
                renderSidebar();
                renderContent();
            }
        });

        // Handle hash navigation after content renders
        function handleHashNavigation() {
            const hash = window.location.hash;
            if (hash) {
                const hashValue = hash.substring(1); // Remove the #

                // Check if the hash contains a category prefix (e.g., "helpers-clearfix")
                const dashIndex = hashValue.indexOf('-');
                if (dashIndex > 0) {
                    const category = hashValue.substring(0, dashIndex);

                    // Check if we need to switch categories
                    if (currentCategory !== category) {
                        // Find which mode/library this category belongs to
                        let foundInClasses = false;
                        let foundInIcons = false;

                        // Check in Bootstrap data
                        for (const version of Object.keys(contentData)) {
                            if (contentData[version][category]) {
                                foundInClasses = true;
                                currentMode = 'classes';
                                currentVersion = version;
                                break;
                            }
                        }

                        // Check in icons data
                        if (!foundInClasses) {
                            for (const lib of Object.keys(iconsData)) {
                                const libData = lib === 'fontawesome' && iconsData[lib].versions
                                    ? iconsData[lib].versions[currentFontAwesomeVersion] || iconsData[lib].versions[iconsData[lib].defaultVersion]
                                    : iconsData[lib];
                                if (libData && libData.categories && libData.categories[category]) {
                                    foundInIcons = true;
                                    currentMode = 'icons';
                                    currentIconLibrary = lib;
                                    break;
                                }
                            }
                        }

                        if (foundInClasses || foundInIcons) {
                            currentCategory = category;

                            // Update mode button styles
                            document.querySelectorAll('.mode-btn').forEach(b => {
                                b.className = 'mode-btn px-6 py-2.5 rounded-lg font-medium transition-all text-slate-600 hover:text-slate-900';
                            });
                            const activeBtn = document.querySelector(`.mode-btn[data-mode="${currentMode}"]`);
                            if (activeBtn) {
                                const modeColor = currentMode === 'icons' ? 'bg-blue-600' : 'bg-purple-600';
                                activeBtn.className = `mode-btn px-6 py-2.5 rounded-lg font-medium transition-all ${modeColor} text-white shadow-md`;
                            }

                            // Show/hide version selector and icon library selector
                            const versionContainer = document.getElementById('version-selector-container');
                            const iconLibraryContainer = document.getElementById('icon-library-selector-container');
                            if (currentMode === 'icons') {
                                versionContainer.classList.add('hidden');
                                iconLibraryContainer.classList.remove('hidden');
                            } else {
                                versionContainer.classList.remove('hidden');
                                iconLibraryContainer.classList.add('hidden');
                            }

                            updateFontAwesomeVersionSelectorVisibility();
                            renderFontAwesomeVersionSelector();
                            updateFontAwesomeStylesheet();
                            renderSidebar();
                            renderContent();
                        }
                    }
                }

                // Small delay to ensure DOM is fully rendered, then scroll
                setTimeout(() => {
                    const element = document.querySelector(hash);
                    if (element) {
                        element.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }
                }, 150);
            }
        }

        // Listen for hash changes
        window.addEventListener('hashchange', handleHashNavigation);

        // Check for hash BEFORE initial render to set the correct category
        function initFromHash() {
            const hash = window.location.hash;
            if (hash) {
                const hashValue = hash.substring(1);
                const dashIndex = hashValue.indexOf('-');
                if (dashIndex > 0) {
                    const category = hashValue.substring(0, dashIndex);

                    // Check in Bootstrap data
                    for (const version of Object.keys(contentData)) {
                        if (contentData[version][category]) {
                            currentMode = 'classes';
                            currentVersion = version;
                            currentCategory = category;
                            return true;
                        }
                    }

                    // Check in icons data
                    for (const lib of Object.keys(iconsData)) {
                        const libData = lib === 'fontawesome' && iconsData[lib].versions
                            ? iconsData[lib].versions[currentFontAwesomeVersion] || iconsData[lib].versions[iconsData[lib].defaultVersion]
                            : iconsData[lib];
                        if (libData && libData.categories && libData.categories[category]) {
                            currentMode = 'icons';
                            currentIconLibrary = lib;
                            currentCategory = category;
                            return true;
                        }
                    }
                }
            }
            return false;
        }

        // Initialize from hash if present
        const hasHashCategory = initFromHash();

        // Update UI if we initialized from hash
        if (hasHashCategory) {
            // Update mode button styles
            document.querySelectorAll('.mode-btn').forEach(b => {
                b.className = 'mode-btn px-6 py-2.5 rounded-lg font-medium transition-all text-slate-600 hover:text-slate-900';
            });
            const activeBtn = document.querySelector(`.mode-btn[data-mode="${currentMode}"]`);
            if (activeBtn) {
                const modeColor = currentMode === 'icons' ? iconLibraryColors[currentIconLibrary] : versionColors[currentVersion];
                activeBtn.className = `mode-btn px-6 py-2.5 rounded-lg font-medium transition-all ${modeColor} text-white shadow-md`;
            }

            // Show/hide version selector and icon library selector
            const versionContainer = document.getElementById('version-selector-container');
            const iconLibraryContainer = document.getElementById('icon-library-selector-container');
            if (currentMode === 'icons') {
                versionContainer.classList.add('hidden');
                iconLibraryContainer.classList.remove('hidden');
            } else {
                versionContainer.classList.remove('hidden');
                iconLibraryContainer.classList.add('hidden');
            }
            updateFontAwesomeVersionSelectorVisibility();
            renderFontAwesomeVersionSelector();
            updateFontAwesomeStylesheet();
        }

        // Initial render
        renderSidebar();
        updateFontAwesomeVersionSelectorVisibility();
        renderFontAwesomeVersionSelector();
        updateFontAwesomeStylesheet();
        renderContent();

        // Scroll to section after render if we had a hash
        if (hasHashCategory && window.location.hash) {
            setTimeout(() => {
                const element = document.querySelector(window.location.hash);
                if (element) {
                    element.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            }, 200);
        }
    </script>
</body>
</html>
