<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Cheat Sheets</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Icon Libraries -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-in { animation: slideIn 0.3s ease-out; }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-50 to-slate-100">
    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center py-4">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-gradient-to-br from-purple-600 to-blue-600 rounded-lg flex items-center justify-center">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path>
                        </svg>
                    </div>
                    <div>
                        <h1 class="text-2xl font-bold text-slate-900">Bootstrap Cheat Sheets</h1>
                        <p class="text-sm text-slate-500">Quick reference for all versions</p>
                    </div>
                </div>
                <button id="mobile-menu-btn" class="lg:hidden p-2">
                    <svg id="menu-icon" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                    <svg id="close-icon" class="w-6 h-6 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Mode Toggle -->
        <div class="mb-6">
            <div class="inline-flex rounded-xl bg-slate-100 p-1">
                <button data-mode="classes" class="mode-btn px-6 py-2.5 rounded-lg font-medium transition-all bg-purple-600 text-white shadow-md">
                    Bootstrap Classes
                </button>
                <button data-mode="icons" class="mode-btn px-6 py-2.5 rounded-lg font-medium transition-all text-slate-600 hover:text-slate-900">
                    Bootstrap Icons
                </button>
            </div>
        </div>

        <!-- Version Selector -->
        <div id="version-selector-container" class="mb-8">
            <label class="block text-sm font-medium text-slate-700 mb-3">Select Bootstrap Version</label>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3" id="version-selector">
                <button data-version="5.3" class="version-btn p-4 rounded-xl border-2 transition-all font-medium bg-purple-600 text-white border-transparent shadow-lg scale-105">
                    Bootstrap 5.3
                </button>
                <button data-version="4.6" class="version-btn p-4 rounded-xl border-2 transition-all font-medium bg-white text-slate-700 border-slate-200 hover:border-slate-300">
                    Bootstrap 4.6
                </button>
                <button data-version="3.4" class="version-btn p-4 rounded-xl border-2 transition-all font-medium bg-white text-slate-700 border-slate-200 hover:border-slate-300">
                    Bootstrap 3.4
                </button>
                <button data-version="2.3" class="version-btn p-4 rounded-xl border-2 transition-all font-medium bg-white text-slate-700 border-slate-200 hover:border-slate-300">
                    Bootstrap 2.3
                </button>
            </div>
        </div>

        <!-- Icon Library Selector -->
        <div id="icon-library-selector-container" class="mb-8 hidden">
            <label class="block text-sm font-medium text-slate-700 mb-3">Select Icon Library</label>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3" id="icon-library-selector">
                <button data-library="bootstrap" class="library-btn p-4 rounded-xl border-2 transition-all font-medium bg-pink-600 text-white border-transparent shadow-lg scale-105">
                    Bootstrap Icons
                </button>
                <button data-library="fontawesome" class="library-btn p-4 rounded-xl border-2 transition-all font-medium bg-white text-slate-700 border-slate-200 hover:border-slate-300">
                    Font Awesome
                </button>
                <button data-library="feather" class="library-btn p-4 rounded-xl border-2 transition-all font-medium bg-white text-slate-700 border-slate-200 hover:border-slate-300">
                    Feather
                </button>
                <button data-library="octicons" class="library-btn p-4 rounded-xl border-2 transition-all font-medium bg-white text-slate-700 border-slate-200 hover:border-slate-300">
                    Octicons
                </button>
            </div>
        </div>

        <!-- Search Bar -->
        <div class="mb-8">
            <div class="relative">
                <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
                <input
                    type="text"
                    id="search-input"
                    placeholder="Search classes, components..."
                    class="w-full pl-12 pr-4 py-3 border-2 border-slate-200 rounded-xl focus:outline-none focus:border-purple-500 bg-white"
                />
            </div>
        </div>

        <div class="grid lg:grid-cols-4 gap-8">
            <!-- Sidebar Navigation -->
            <div id="sidebar" class="hidden lg:block">
                <div class="bg-white rounded-xl shadow-sm p-4 sticky top-24">
                    <h3 class="font-semibold text-slate-900 mb-4">Categories</h3>
                    <nav class="space-y-1" id="category-nav">
                        <!-- Categories populated by JavaScript -->
                    </nav>
                </div>
            </div>

            <!-- Main Content Area -->
            <div class="lg:col-span-3">
                <div class="bg-white rounded-xl shadow-sm p-6 sm:p-8">
                    <div class="flex items-center justify-between mb-6">
                        <h2 id="content-title" class="text-3xl font-bold text-slate-900">Grid System</h2>
                        <span id="version-badge" class="px-4 py-1.5 bg-purple-600 text-white text-sm font-medium rounded-full">
                            v5.3
                        </span>
                    </div>

                    <div id="content-container" class="space-y-4">
                        <!-- Content will be populated by JavaScript -->
                    </div>
                </div>

                <!-- CDN Quick Reference -->
                <div class="mt-6 bg-gradient-to-r from-purple-50 to-blue-50 rounded-xl p-6 border-2 border-purple-100">
                    <h3 class="font-semibold text-slate-900 mb-3">📦 CDN Quick Reference</h3>
                    <p class="text-sm text-slate-600 mb-3">Add Bootstrap <span id="cdn-version">5.3</span> to your project:</p>
                    <pre class="bg-white p-4 rounded-lg overflow-x-auto border border-purple-200"><code id="cdn-code" class="text-sm text-slate-800"></code></pre>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Data Files -->
    <script src="data/bootstrap/bootstrap-5.3.js"></script>
    <script src="data/bootstrap/bootstrap-4.6.js"></script>
    <script src="data/bootstrap/bootstrap-3.4.js"></script>
    <script src="data/bootstrap/bootstrap-2.3.js"></script>
    <script src="data/icons.js"></script>
    <script>
        // Content data - references external files
        const contentData = {
            '5.3': bootstrap53Data,
            '4.6': bootstrap46Data,
            '3.4': bootstrap34Data,
            '2.3': bootstrap23Data
        };

        const versionColors = {
            '5.3': 'bg-purple-600',
            '4.6': 'bg-blue-600',
            '3.4': 'bg-green-600',
            '2.3': 'bg-orange-600'
        };

        const iconLibraryColors = {
            'bootstrap': 'bg-pink-600',
            'fontawesome': 'bg-blue-600',
            'feather': 'bg-cyan-600',
            'octicons': 'bg-slate-700'
        };

        // Sidebar category definitions
        const classesCategories = [
            {
                id: 'layout',
                name: 'Layout',
                icon: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 5a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM14 5a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1V5zM4 15a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1H5a1 1 0 01-1-1v-4zM14 15a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z"></path>',
                isParent: true,
                children: [
                    { id: 'breakpoints', name: 'Breakpoints' },
                    { id: 'containers', name: 'Containers' },
                    { id: 'grid', name: 'Grid' },
                    { id: 'columns', name: 'Columns' },
                    { id: 'gutters', name: 'Gutters' },
                    { id: 'layout-utilities', name: 'Utilities' },
                    { id: 'z-index', name: 'Z-index' },
                    { id: 'css-grid', name: 'CSS Grid' }
                ]
            },
{
                id: 'content',
                name: 'Content',
                icon: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>',
                isParent: true,
                children: [
                    { id: 'reboot', name: 'Reboot' },
                    { id: 'typography', name: 'Typography' },
                    { id: 'images', name: 'Images' },
                    { id: 'tables', name: 'Tables' },
                    { id: 'figures', name: 'Figures' }
                ]
            },
            { id: 'components', name: 'Components', icon: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 5a1 1 0 011-1h4a1 1 0 011 1v7a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM14 5a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1V5z"></path>' },
            { id: 'utilities', name: 'Utilities', icon: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01"></path>' },
            { id: 'forms', name: 'Forms', icon: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>' },
            { id: 'javascript', name: 'JavaScript', icon: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>' }
        ];

        // Track expanded parent categories
        let expandedCategories = { 'layout': true, 'content': false };

        const iconsCategories = [
            { id: 'getting-started', name: 'Getting Started', icon: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>' },
            { id: 'usage', name: 'Usage', icon: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path>' },
            { id: 'styling', name: 'Styling', icon: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01"></path>' },
            { id: 'examples', name: 'Examples', icon: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path>' }
        ];

        let currentMode = 'classes';
        let currentVersion = '5.3';
        let currentCategory = 'breakpoints';
        let currentIconLibrary = 'bootstrap';
        let searchQuery = '';

        // Render sidebar categories based on current mode
        function renderSidebar() {
            const categories = currentMode === 'icons' ? iconsCategories : classesCategories;
            const nav = document.getElementById('category-nav');
            const activeColor = currentMode === 'icons' ? iconLibraryColors[currentIconLibrary] : versionColors[currentVersion];

            // Check if current category is a child of a parent
            function isChildActive(cat) {
                if (!cat.children) return false;
                return cat.children.some(child => child.id === currentCategory);
            }

            nav.innerHTML = categories.map((cat, index) => {
                const isActive = cat.id === currentCategory;
                const hasActiveChild = isChildActive(cat);
                const isExpanded = expandedCategories[cat.id] || false;

                if (cat.isParent && cat.children) {
                    // Parent category with children
                    const parentClass = hasActiveChild
                        ? `parent-btn w-full flex items-center gap-3 px-4 py-3 rounded-lg transition-all bg-slate-100 text-slate-900`
                        : 'parent-btn w-full flex items-center gap-3 px-4 py-3 rounded-lg transition-all text-slate-700 hover:bg-slate-50';

                    const childrenHtml = isExpanded ? cat.children.map(child => {
                        const isChildActive = child.id === currentCategory;
                        const childClass = isChildActive
                            ? `category-btn w-full flex items-center gap-3 pl-10 pr-4 py-2 rounded-lg transition-all ${activeColor} text-white shadow-md text-sm`
                            : 'category-btn w-full flex items-center gap-3 pl-10 pr-4 py-2 rounded-lg transition-all text-slate-600 hover:bg-slate-50 text-sm';

                        return `
                            <button data-category="${child.id}" class="${childClass}">
                                <span class="font-medium">${child.name}</span>
                            </button>
                        `;
                    }).join('') : '';

                    return `
                        <div class="parent-category">
                            <button data-parent="${cat.id}" class="${parentClass}">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    ${cat.icon}
                                </svg>
                                <span class="font-medium flex-grow text-left">${cat.name}</span>
                                <svg class="w-4 h-4 transition-transform ${isExpanded ? 'rotate-90' : ''}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                                </svg>
                            </button>
                            <div class="children-container ${isExpanded ? '' : 'hidden'} space-y-1 mt-1">
                                ${childrenHtml}
                            </div>
                        </div>
                    `;
                } else {
                    // Regular category without children
                    const btnClass = isActive
                        ? `category-btn w-full flex items-center gap-3 px-4 py-3 rounded-lg transition-all ${activeColor} text-white shadow-md`
                        : 'category-btn w-full flex items-center gap-3 px-4 py-3 rounded-lg transition-all text-slate-700 hover:bg-slate-50';

                    return `
                        <button data-category="${cat.id}" class="${btnClass}">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                ${cat.icon}
                            </svg>
                            <span class="font-medium">${cat.name}</span>
                        </button>
                    `;
                }
            }).join('');

            // Re-attach category click handlers
            attachCategoryListeners();
            attachParentListeners();
        }

        // Handle parent category expand/collapse
        function attachParentListeners() {
            document.querySelectorAll('.parent-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const parentId = btn.dataset.parent;
                    expandedCategories[parentId] = !expandedCategories[parentId];
                    renderSidebar();
                });
            });
        }

        // Render content based on current mode
        function renderContent() {
            let content;
            const container = document.getElementById('content-container');
            const versionBadge = document.getElementById('version-badge');
            const cdnVersionSpan = document.getElementById('cdn-version');
            const cdnCode = document.getElementById('cdn-code');

            if (currentMode === 'icons') {
                const libraryData = iconsData[currentIconLibrary];
                content = libraryData.categories[currentCategory] || libraryData.categories['getting-started'];
                // Show count for Examples category
                if (currentCategory === 'examples') {
                    document.getElementById('content-title').textContent = `${content.title} (${content.items.length} icons)`;
                } else {
                    document.getElementById('content-title').textContent = content.title;
                }
                const libraryColor = iconLibraryColors[currentIconLibrary];
                versionBadge.textContent = libraryData.name;
                versionBadge.className = `px-4 py-1.5 ${libraryColor} text-white text-sm font-medium rounded-full`;
                cdnVersionSpan.textContent = libraryData.name;
                cdnCode.textContent = libraryData.cdnLink;
            } else {
                // Try to get content for current version and category
                // Fall back to 5.3 data if not available, using 'grid' as the fallback for layout subcategories
                let categoryToUse = currentCategory;
                let versionData = contentData[currentVersion];

                // Check if category exists in current version
                if (!versionData?.[currentCategory]) {
                    // For layout subcategories in older versions, fall back appropriately
                    const layoutSubcategories = ['breakpoints', 'containers', 'grid', 'columns', 'gutters', 'layout-utilities', 'z-index', 'css-grid'];
                    const contentSubcategories = ['reboot', 'typography', 'images', 'tables', 'figures'];

                    if (layoutSubcategories.includes(currentCategory)) {
                        // Try 5.3 data first for layout subcategories
                        content = contentData['5.3']?.[currentCategory];
                        if (!content) {
                            content = versionData?.['grid'] || contentData['5.3'].grid;
                        }
                    } else if (contentSubcategories.includes(currentCategory)) {
                        // Try 5.3 data first for content subcategories
                        content = contentData['5.3']?.[currentCategory];
                        if (!content) {
                            content = versionData?.['typography'] || contentData['5.3'].typography;
                        }
                    } else {
                        content = contentData['5.3']?.[currentCategory] || contentData['5.3'].breakpoints;
                    }
                } else {
                    content = versionData[currentCategory];
                }
                document.getElementById('content-title').textContent = content.title;
                versionBadge.textContent = `v${currentVersion}`;
                const versionColor = versionColors[currentVersion];
                versionBadge.className = `px-4 py-1.5 ${versionColor} text-white text-sm font-medium rounded-full`;
                cdnVersionSpan.textContent = currentVersion;
                cdnCode.textContent =
`<link href="https://cdn.jsdelivr.net/npm/bootstrap@${currentVersion}.0/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@${currentVersion}.0/dist/js/bootstrap.bundle.min.js"><\/script>`;
            }

            if (!content || !content.items || content.items.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 text-slate-500">
                        <p>Content coming soon for this section</p>
                    </div>
                `;
                return;
            }

            // Special rendering for icon examples
            if (currentMode === 'icons' && currentCategory === 'examples') {
                // Sort icons alphabetically by name
                const sortedItems = [...content.items].sort((a, b) => a.name.localeCompare(b.name));
                const libraryColor = iconLibraryColors[currentIconLibrary];
                const hoverColor = {
                    'bootstrap': 'hover:border-pink-200',
                    'fontawesome': 'hover:border-blue-200',
                    'feather': 'hover:border-cyan-200',
                    'octicons': 'hover:border-slate-300'
                }[currentIconLibrary];
                const btnColor = {
                    'bootstrap': 'bg-pink-100 hover:bg-pink-200 text-pink-700',
                    'fontawesome': 'bg-blue-100 hover:bg-blue-200 text-blue-700',
                    'feather': 'bg-cyan-100 hover:bg-cyan-200 text-cyan-700',
                    'octicons': 'bg-slate-200 hover:bg-slate-300 text-slate-700'
                }[currentIconLibrary];

                // Generate icon HTML based on library
                function renderIconPreview(item) {
                    switch (currentIconLibrary) {
                        case 'bootstrap':
                            return `<i class="bi ${item.icon}"></i>`;
                        case 'fontawesome':
                            return `<i class="${item.icon}"></i>`;
                        case 'feather':
                            return `<i data-feather="${item.icon}"></i>`;
                        case 'octicons':
                            return `<span class="octicon ${item.icon}"></span>`;
                        default:
                            return `<i class="${item.icon}"></i>`;
                    }
                }

                container.innerHTML = `
                    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-4">
                        ${sortedItems.map((item, index) => `
                            <div class="border-2 border-slate-100 rounded-lg p-4 ${hoverColor} hover:shadow-md transition-all animate-slide-in text-center flex flex-col h-full">
                                <div class="text-4xl mb-3 text-slate-700">
                                    ${renderIconPreview(item)}
                                </div>
                                <h3 class="text-sm font-semibold text-slate-900 mb-1">${item.name}</h3>
                                <p class="text-xs text-slate-500 mb-3 flex-grow">${item.description}</p>
                                <button data-code="${escapeHtml(item.code)}" class="copy-btn text-xs px-3 py-1.5 ${btnColor} rounded-md transition-colors w-full mt-auto">
                                    Copy
                                </button>
                            </div>
                        `).join('')}
                    </div>
                `;

                // Initialize Feather icons if needed
                if (currentIconLibrary === 'feather' && typeof feather !== 'undefined') {
                    feather.replace();
                }

                // Attach event listeners for sorted icon examples
                document.querySelectorAll('.copy-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const code = this.getAttribute('data-code');
                        copyToClipboard(code, this);
                    });
                });
                return;
            } else {
                container.innerHTML = content.items.map((item, index) => `
                    <div class="border-2 border-slate-100 rounded-lg p-5 hover:border-purple-200 hover:shadow-md transition-all animate-slide-in">
                        <h3 class="text-lg font-semibold text-slate-900 mb-1">${item.name}</h3>
                        <p class="text-sm text-slate-600 mb-4">${item.description}</p>
                        ${item.preview ? `
                        <div class="bg-gradient-to-br from-slate-50 to-white border border-slate-200 rounded-lg p-4 mb-4">
                            <div class="text-xs text-slate-400 uppercase tracking-wide mb-2 font-medium">Preview</div>
                            <div class="preview-content">${item.preview}</div>
                        </div>
                        ` : ''}
                        <div class="rounded-lg overflow-hidden border border-slate-700">
                            <div class="bg-slate-800 px-4 py-2 flex items-center justify-between border-b border-slate-700">
                                <span class="text-xs text-slate-400 font-medium uppercase tracking-wide">HTML</span>
                                <button data-index="${index}" class="copy-btn text-xs px-3 py-1 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded transition-colors flex items-center gap-1.5">
                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                                    </svg>
                                    Copy
                                </button>
                            </div>
                            <pre class="bg-slate-900 text-slate-100 p-4 overflow-x-auto m-0"><code class="text-sm">${escapeHtml(item.code)}</code></pre>
                        </div>
                    </div>
                `).join('');
            }

            // Attach event listeners to copy buttons
            document.querySelectorAll('.copy-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const index = parseInt(this.getAttribute('data-index'));
                    const code = content.items[index].code;
                    copyToClipboard(code, this);
                });
            });
        }

        // Helper function to escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Copy to clipboard
        function copyToClipboard(text, button) {
            navigator.clipboard.writeText(text).then(() => {
                const originalText = button.textContent;
                button.textContent = 'Copied!';
                button.classList.add('bg-green-100');
                setTimeout(() => {
                    button.textContent = originalText;
                    button.classList.remove('bg-green-100');
                }, 2000);
            });
        }

        // Search function - returns matching items across all categories
        function performSearch(query) {
            const results = [];
            const lowerQuery = query.toLowerCase();

            if (currentMode === 'icons' && currentCategory === 'examples') {
                // When on Examples category, only search within examples (icon names and descriptions)
                const libraryData = iconsData[currentIconLibrary];
                const examplesCategory = libraryData.categories['examples'];
                examplesCategory.items.forEach(item => {
                    if (item.name.toLowerCase().includes(lowerQuery) ||
                        item.description.toLowerCase().includes(lowerQuery)) {
                        results.push({ ...item, categoryId: 'examples', categoryTitle: examplesCategory.title });
                    }
                });
            } else if (currentMode === 'icons') {
                // Search through all iconsData categories for current library
                const libraryData = iconsData[currentIconLibrary];
                Object.entries(libraryData.categories).forEach(([categoryId, category]) => {
                    category.items.forEach(item => {
                        if (item.name.toLowerCase().includes(lowerQuery) ||
                            item.description.toLowerCase().includes(lowerQuery) ||
                            item.code.toLowerCase().includes(lowerQuery)) {
                            results.push({ ...item, categoryId, categoryTitle: category.title });
                        }
                    });
                });
            } else {
                // Search through contentData for current version
                const versionData = contentData[currentVersion] || {};
                Object.entries(versionData).forEach(([categoryId, category]) => {
                    category.items.forEach(item => {
                        if (item.name.toLowerCase().includes(lowerQuery) ||
                            item.description.toLowerCase().includes(lowerQuery) ||
                            item.code.toLowerCase().includes(lowerQuery)) {
                            results.push({ ...item, categoryId, categoryTitle: category.title });
                        }
                    });
                });
            }

            return results;
        }

        // Render search results
        function renderSearchResults(results) {
            const container = document.getElementById('content-container');
            document.getElementById('content-title').textContent = `Search Results (${results.length})`;

            if (results.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 text-slate-500">
                        <p>No results found for "${escapeHtml(searchQuery)}"</p>
                    </div>
                `;
                return;
            }

            // Check if we're in icons mode and results contain icon examples
            const hasIconExamples = currentMode === 'icons' && results.some(item => item.icon);

            if (hasIconExamples && results.every(item => item.icon)) {
                // All results are icon examples - use grid layout
                container.innerHTML = `
                    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-4">
                        ${results.map((item, index) => `
                            <div class="border-2 border-slate-100 rounded-lg p-4 hover:border-pink-200 hover:shadow-md transition-all animate-slide-in text-center flex flex-col h-full">
                                <div class="text-4xl mb-3 text-slate-700">
                                    <i class="bi ${item.icon}"></i>
                                </div>
                                <h3 class="text-sm font-semibold text-slate-900 mb-1">${item.name}</h3>
                                <p class="text-xs text-slate-500 mb-3 flex-grow">${item.description}</p>
                                <button data-code="${escapeHtml(item.code)}" class="search-copy-btn text-xs px-3 py-1.5 bg-pink-100 hover:bg-pink-200 text-pink-700 rounded-md transition-colors w-full mt-auto">
                                    Copy
                                </button>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else {
                // Mixed results or non-icon results - use list layout
                container.innerHTML = results.map((item, index) => `
                    <div class="border-2 border-slate-100 rounded-lg p-5 hover:border-purple-200 hover:shadow-md transition-all animate-slide-in">
                        <div class="flex items-start justify-between mb-2">
                            <div>
                                ${item.icon ? `<span class="text-2xl mr-2"><i class="bi ${item.icon}"></i></span>` : ''}
                                <h3 class="text-lg font-semibold text-slate-900 inline">${item.name}</h3>
                                <span class="ml-2 text-xs px-2 py-0.5 bg-slate-100 text-slate-600 rounded">${item.categoryTitle}</span>
                            </div>
                            <button data-code="${escapeHtml(item.code)}" class="search-copy-btn text-sm px-3 py-1 bg-slate-100 hover:bg-slate-200 rounded-md transition-colors">
                                Copy
                            </button>
                        </div>
                        <p class="text-sm text-slate-600 mb-3">${item.description}</p>
                        <pre class="bg-slate-900 text-slate-100 p-4 rounded-lg overflow-x-auto"><code class="text-sm">${escapeHtml(item.code)}</code></pre>
                    </div>
                `).join('');
            }

            // Attach event listeners to search result copy buttons
            document.querySelectorAll('.search-copy-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const code = this.getAttribute('data-code');
                    copyToClipboard(code, this);
                });
            });
        }

        // Render filtered examples (when searching within Examples category)
        function renderFilteredExamples(results) {
            const container = document.getElementById('content-container');
            const libraryData = iconsData[currentIconLibrary];
            document.getElementById('content-title').textContent = results.length === libraryData.categories['examples'].items.length
                ? 'Examples'
                : `Examples (${results.length} found)`;

            if (results.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 text-slate-500">
                        <p>No icons found for "${escapeHtml(searchQuery)}"</p>
                    </div>
                `;
                return;
            }

            // Sort results alphabetically by name
            const sortedResults = [...results].sort((a, b) => a.name.localeCompare(b.name));

            const hoverColor = {
                'bootstrap': 'hover:border-pink-200',
                'fontawesome': 'hover:border-blue-200',
                'feather': 'hover:border-cyan-200',
                'octicons': 'hover:border-slate-300'
            }[currentIconLibrary];
            const btnColor = {
                'bootstrap': 'bg-pink-100 hover:bg-pink-200 text-pink-700',
                'fontawesome': 'bg-blue-100 hover:bg-blue-200 text-blue-700',
                'feather': 'bg-cyan-100 hover:bg-cyan-200 text-cyan-700',
                'octicons': 'bg-slate-200 hover:bg-slate-300 text-slate-700'
            }[currentIconLibrary];

            // Generate icon HTML based on library
            function renderIconPreview(item) {
                switch (currentIconLibrary) {
                    case 'bootstrap':
                        return `<i class="bi ${item.icon}"></i>`;
                    case 'fontawesome':
                        return `<i class="${item.icon}"></i>`;
                    case 'feather':
                        return `<i data-feather="${item.icon}"></i>`;
                    case 'octicons':
                        return `<span class="octicon ${item.icon}"></span>`;
                    default:
                        return `<i class="${item.icon}"></i>`;
                }
            }

            container.innerHTML = `
                <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-4">
                    ${sortedResults.map((item, index) => `
                        <div class="border-2 border-slate-100 rounded-lg p-4 ${hoverColor} hover:shadow-md transition-all animate-slide-in text-center flex flex-col h-full">
                            <div class="text-4xl mb-3 text-slate-700">
                                ${renderIconPreview(item)}
                            </div>
                            <h3 class="text-sm font-semibold text-slate-900 mb-1">${item.name}</h3>
                            <p class="text-xs text-slate-500 mb-3 flex-grow">${item.description}</p>
                            <button data-code="${escapeHtml(item.code)}" class="search-copy-btn text-xs px-3 py-1.5 ${btnColor} rounded-md transition-colors w-full mt-auto">
                                Copy
                            </button>
                        </div>
                    `).join('')}
                </div>
            `;

            // Initialize Feather icons if needed
            if (currentIconLibrary === 'feather' && typeof feather !== 'undefined') {
                feather.replace();
            }

            // Attach event listeners to copy buttons
            document.querySelectorAll('.search-copy-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const code = this.getAttribute('data-code');
                    copyToClipboard(code, this);
                });
            });
        }

        // Clear search helper
        function clearSearch() {
            searchQuery = '';
            const searchInput = document.getElementById('search-input');
            if (searchInput) searchInput.value = '';
        }

        // Attach category button listeners
        function attachCategoryListeners() {
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    currentCategory = btn.dataset.category;
                    clearSearch();
                    renderSidebar();
                    renderContent();
                    // Close mobile menu
                    document.getElementById('sidebar').classList.add('hidden');
                    document.getElementById('sidebar').classList.add('lg:block');
                    document.getElementById('menu-icon').classList.remove('hidden');
                    document.getElementById('close-icon').classList.add('hidden');
                });
            });
        }

        // Mode toggle
        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                currentMode = btn.dataset.mode;
                clearSearch();

                // Update mode button styles
                document.querySelectorAll('.mode-btn').forEach(b => {
                    b.className = 'mode-btn px-6 py-2.5 rounded-lg font-medium transition-all text-slate-600 hover:text-slate-900';
                });
                const modeColor = currentMode === 'icons' ? iconLibraryColors[currentIconLibrary] : 'bg-purple-600';
                btn.className = `mode-btn px-6 py-2.5 rounded-lg font-medium transition-all ${modeColor} text-white shadow-md`;

                // Show/hide version selector and icon library selector
                const versionContainer = document.getElementById('version-selector-container');
                const iconLibraryContainer = document.getElementById('icon-library-selector-container');
                if (currentMode === 'icons') {
                    versionContainer.classList.add('hidden');
                    iconLibraryContainer.classList.remove('hidden');
                    currentCategory = 'getting-started';
                } else {
                    versionContainer.classList.remove('hidden');
                    iconLibraryContainer.classList.add('hidden');
                    currentCategory = 'breakpoints';
                    expandedCategories['layout'] = true;
                }

                renderSidebar();
                renderContent();
            });
        });

        // Version selector
        document.querySelectorAll('.version-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                currentVersion = btn.dataset.version;
                clearSearch();
                document.querySelectorAll('.version-btn').forEach(b => {
                    b.className = 'version-btn p-4 rounded-xl border-2 transition-all font-medium bg-white text-slate-700 border-slate-200 hover:border-slate-300';
                });
                const color = versionColors[currentVersion];
                btn.className = `version-btn p-4 rounded-xl border-2 transition-all font-medium ${color} text-white border-transparent shadow-lg scale-105`;
                renderSidebar();
                renderContent();
            });
        });

        // Icon library selector
        document.querySelectorAll('.library-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                currentIconLibrary = btn.dataset.library;
                clearSearch();
                document.querySelectorAll('.library-btn').forEach(b => {
                    b.className = 'library-btn p-4 rounded-xl border-2 transition-all font-medium bg-white text-slate-700 border-slate-200 hover:border-slate-300';
                });
                const color = iconLibraryColors[currentIconLibrary];
                btn.className = `library-btn p-4 rounded-xl border-2 transition-all font-medium ${color} text-white border-transparent shadow-lg scale-105`;
                renderSidebar();
                renderContent();
            });
        });

        // Mobile menu toggle
        document.getElementById('mobile-menu-btn').addEventListener('click', () => {
            const sidebar = document.getElementById('sidebar');
            const menuIcon = document.getElementById('menu-icon');
            const closeIcon = document.getElementById('close-icon');

            sidebar.classList.toggle('hidden');
            menuIcon.classList.toggle('hidden');
            closeIcon.classList.toggle('hidden');
        });

        // Search input handler
        document.getElementById('search-input').addEventListener('input', (e) => {
            searchQuery = e.target.value.trim();

            if (searchQuery.length > 0) {
                const results = performSearch(searchQuery);

                // When on Examples category, keep category selected and show filtered results
                if (currentMode === 'icons' && currentCategory === 'examples') {
                    renderFilteredExamples(results);
                } else {
                    renderSearchResults(results);
                    // Deselect current category in sidebar
                    document.querySelectorAll('.category-btn').forEach(b => {
                        b.className = 'category-btn w-full flex items-center gap-3 px-4 py-3 rounded-lg transition-all text-slate-700 hover:bg-slate-50';
                    });
                }
            } else {
                // Clear search, restore normal view
                renderSidebar();
                renderContent();
            }
        });

        // Initial render
        renderSidebar();
        renderContent();
    </script>
</body>
</html>
