<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Cheat Sheets</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-in { animation: slideIn 0.3s ease-out; }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-50 to-slate-100">
    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center py-4">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-gradient-to-br from-purple-600 to-blue-600 rounded-lg flex items-center justify-center">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path>
                        </svg>
                    </div>
                    <div>
                        <h1 class="text-2xl font-bold text-slate-900">Bootstrap Cheat Sheets</h1>
                        <p class="text-sm text-slate-500">Quick reference for all versions</p>
                    </div>
                </div>
                <button id="mobile-menu-btn" class="lg:hidden p-2">
                    <svg id="menu-icon" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                    <svg id="close-icon" class="w-6 h-6 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Version Selector -->
        <div class="mb-8">
            <label class="block text-sm font-medium text-slate-700 mb-3">Select Bootstrap Version</label>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3" id="version-selector">
                <button data-version="5.3" class="version-btn p-4 rounded-xl border-2 transition-all font-medium bg-purple-600 text-white border-transparent shadow-lg scale-105">
                    Bootstrap 5.3
                </button>
                <button data-version="4.6" class="version-btn p-4 rounded-xl border-2 transition-all font-medium bg-white text-slate-700 border-slate-200 hover:border-slate-300">
                    Bootstrap 4.6
                </button>
                <button data-version="3.4" class="version-btn p-4 rounded-xl border-2 transition-all font-medium bg-white text-slate-700 border-slate-200 hover:border-slate-300">
                    Bootstrap 3.4
                </button>
                <button data-version="2.3" class="version-btn p-4 rounded-xl border-2 transition-all font-medium bg-white text-slate-700 border-slate-200 hover:border-slate-300">
                    Bootstrap 2.3
                </button>
            </div>
        </div>

        <!-- Search Bar -->
        <div class="mb-8">
            <div class="relative">
                <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
                <input
                    type="text"
                    id="search-input"
                    placeholder="Search classes, components..."
                    class="w-full pl-12 pr-4 py-3 border-2 border-slate-200 rounded-xl focus:outline-none focus:border-purple-500 bg-white"
                />
            </div>
        </div>

        <div class="grid lg:grid-cols-4 gap-8">
            <!-- Sidebar Navigation -->
            <div id="sidebar" class="hidden lg:block">
                <div class="bg-white rounded-xl shadow-sm p-4 sticky top-24">
                    <h3 class="font-semibold text-slate-900 mb-4">Categories</h3>
                    <nav class="space-y-1" id="category-nav">
                        <button data-category="grid" class="category-btn w-full flex items-center gap-3 px-4 py-3 rounded-lg transition-all bg-purple-600 text-white shadow-md">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 5a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM14 5a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1V5zM4 15a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1H5a1 1 0 01-1-1v-4zM14 15a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z"></path>
                            </svg>
                            <span class="font-medium">Grid System</span>
                        </button>
                        <button data-category="typography" class="category-btn w-full flex items-center gap-3 px-4 py-3 rounded-lg transition-all text-slate-700 hover:bg-slate-50">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7h18M3 12h18M3 17h18"></path>
                            </svg>
                            <span class="font-medium">Typography</span>
                        </button>
                        <button data-category="components" class="category-btn w-full flex items-center gap-3 px-4 py-3 rounded-lg transition-all text-slate-700 hover:bg-slate-50">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 5a1 1 0 011-1h4a1 1 0 011 1v7a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM14 5a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1V5z"></path>
                            </svg>
                            <span class="font-medium">Components</span>
                        </button>
                        <button data-category="utilities" class="category-btn w-full flex items-center gap-3 px-4 py-3 rounded-lg transition-all text-slate-700 hover:bg-slate-50">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01"></path>
                            </svg>
                            <span class="font-medium">Utilities</span>
                        </button>
                        <button data-category="forms" class="category-btn w-full flex items-center gap-3 px-4 py-3 rounded-lg transition-all text-slate-700 hover:bg-slate-50">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path>
                            </svg>
                            <span class="font-medium">Forms</span>
                        </button>
                        <button data-category="javascript" class="category-btn w-full flex items-center gap-3 px-4 py-3 rounded-lg transition-all text-slate-700 hover:bg-slate-50">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                            </svg>
                            <span class="font-medium">JavaScript</span>
                        </button>
                        <button data-category="icons" class="category-btn w-full flex items-center gap-3 px-4 py-3 rounded-lg transition-all text-slate-700 hover:bg-slate-50">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                            <span class="font-medium">Bootstrap Icons</span>
                        </button>
                    </nav>
                </div>
            </div>

            <!-- Main Content Area -->
            <div class="lg:col-span-3">
                <div class="bg-white rounded-xl shadow-sm p-6 sm:p-8">
                    <div class="flex items-center justify-between mb-6">
                        <h2 id="content-title" class="text-3xl font-bold text-slate-900">Grid System</h2>
                        <span id="version-badge" class="px-4 py-1.5 bg-purple-600 text-white text-sm font-medium rounded-full">
                            v5.3
                        </span>
                    </div>

                    <div id="content-container" class="space-y-4">
                        <!-- Content will be populated by JavaScript -->
                    </div>
                </div>

                <!-- CDN Quick Reference -->
                <div class="mt-6 bg-gradient-to-r from-purple-50 to-blue-50 rounded-xl p-6 border-2 border-purple-100">
                    <h3 class="font-semibold text-slate-900 mb-3">📦 CDN Quick Reference</h3>
                    <p class="text-sm text-slate-600 mb-3">Add Bootstrap <span id="cdn-version">5.3</span> to your project:</p>
                    <pre class="bg-white p-4 rounded-lg overflow-x-auto border border-purple-200"><code id="cdn-code" class="text-sm text-slate-800"></code></pre>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Content data
        const contentData = {
            '5.3': {
                grid: {
                    title: 'Grid System',
                    items: [
                        { name: 'Container', code: '<div class="container">...</div>', description: 'Fixed-width container with responsive breakpoints' },
                        { name: 'Container Fluid', code: '<div class="container-fluid">...</div>', description: 'Full-width container spanning viewport' },
                        { name: 'Row', code: '<div class="row">...</div>', description: 'Wrapper for columns with -12px margin' },
                        { name: 'Columns', code: '<div class="col-md-6">...</div>', description: 'Responsive columns (breakpoints: sm, md, lg, xl, xxl)' },
                        { name: 'Auto Layout', code: '<div class="col">...</div>', description: 'Equal-width columns without specifying size' },
                        { name: 'Offset', code: '<div class="col-md-4 offset-md-4">...</div>', description: 'Offset columns to the right' }
                    ]
                },
                typography: {
                    title: 'Typography',
                    items: [
                        { name: 'Display Headings', code: '<h1 class="display-1">...</h1>', description: 'Larger, attention-grabbing headings (1-6)' },
                        { name: 'Lead Text', code: '<p class="lead">...</p>', description: 'Make paragraph stand out' },
                        { name: 'Text Alignment', code: '<p class="text-start">...</p>', description: 'text-start, text-center, text-end' },
                        { name: 'Text Colors', code: '<p class="text-primary">...</p>', description: 'primary, secondary, success, danger, warning, info' },
                        { name: 'Font Weight', code: '<span class="fw-bold">...</span>', description: 'fw-light, fw-normal, fw-bold, fw-bolder' },
                        { name: 'Text Transform', code: '<p class="text-uppercase">...</p>', description: 'uppercase, lowercase, capitalize' }
                    ]
                },
                components: {
                    title: 'Components',
                    items: [
                        { name: 'Button', code: '<button class="btn btn-primary">Button</button>', description: 'Primary action button' },
                        { name: 'Card', code: '<div class="card"><div class="card-body">...</div></div>', description: 'Flexible content container' },
                        { name: 'Alert', code: '<div class="alert alert-warning">...</div>', description: 'Contextual feedback messages' },
                        { name: 'Badge', code: '<span class="badge bg-primary">New</span>', description: 'Small count and labeling component' },
                        { name: 'Navbar', code: '<nav class="navbar navbar-expand-lg">...</nav>', description: 'Responsive navigation header' },
                        { name: 'Modal', code: '<div class="modal" tabindex="-1">...</div>', description: 'Dialog overlay component' }
                    ]
                },
                utilities: {
                    title: 'Utility Classes',
                    items: [
                        { name: 'Margin', code: '<div class="m-3">...</div>', description: 'm-{0-5}, mt-, mb-, ms-, me-, mx-, my-' },
                        { name: 'Padding', code: '<div class="p-3">...</div>', description: 'p-{0-5}, pt-, pb-, ps-, pe-, px-, py-' },
                        { name: 'Display', code: '<div class="d-flex">...</div>', description: 'd-none, d-block, d-flex, d-grid, d-inline' },
                        { name: 'Flexbox', code: '<div class="d-flex justify-content-center">...</div>', description: 'justify-content-, align-items-, flex-direction-' },
                        { name: 'Spacing', code: '<div class="gap-3">...</div>', description: 'Gap spacing for flex/grid containers' },
                        { name: 'Borders', code: '<div class="border border-primary">...</div>', description: 'border, border-{top|end|bottom|start}' }
                    ]
                },
                forms: {
                    title: 'Forms',
                    items: [
                        { name: 'Form Control', code: '<input class="form-control" type="text">', description: 'Textual form input' },
                        { name: 'Form Select', code: '<select class="form-select">...</select>', description: 'Custom select menu' },
                        { name: 'Checkbox', code: '<input class="form-check-input" type="checkbox">', description: 'Checkbox input' },
                        { name: 'Input Group', code: '<div class="input-group">...</div>', description: 'Extend form controls with text/buttons' },
                        { name: 'Validation', code: '<input class="form-control is-valid">', description: 'is-valid, is-invalid states' },
                        { name: 'Floating Label', code: '<div class="form-floating">...</div>', description: 'Floating label inputs' }
                    ]
                },
                javascript: {
                    title: 'JavaScript Components',
                    items: [
                        { name: 'Collapse', code: '<div class="collapse" id="example">...</div>', description: 'Toggle visibility with data-bs-toggle' },
                        { name: 'Dropdown', code: '<div class="dropdown">...</div>', description: 'Toggleable contextual overlay' },
                        { name: 'Toast', code: '<div class="toast">...</div>', description: 'Lightweight notification' },
                        { name: 'Tooltip', code: 'data-bs-toggle="tooltip" title="..."', description: 'Requires JavaScript initialization' },
                        { name: 'Offcanvas', code: '<div class="offcanvas offcanvas-start">...</div>', description: 'Hidden sidebar component' },
                        { name: 'Carousel', code: '<div class="carousel slide">...</div>', description: 'Cycling slideshow component' }
                    ]
                },
                icons: {
                    title: 'Bootstrap Icons',
                    items: [
                        { name: 'CDN Link', code: '<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css">', description: 'Include Bootstrap Icons via CDN' },
                        { name: 'NPM Install', code: 'npm i bootstrap-icons', description: 'Install via npm for local projects' },
                        { name: 'Icon Usage', code: '<i class="bi bi-heart-fill"></i>', description: 'Use icons with the bi class prefix' },
                        { name: 'SVG Usage', code: '<svg class="bi" width="32" height="32" fill="currentColor">\n  <use xlink:href="bootstrap-icons.svg#heart-fill"/>\n</svg>', description: 'Use icons as inline SVG sprites' },
                        { name: 'Icon Sizing', code: '<i class="bi bi-heart" style="font-size: 2rem;"></i>', description: 'Scale icons using font-size' },
                        { name: 'Icon Colors', code: '<i class="bi bi-heart text-danger"></i>', description: 'Color icons with text utilities' },
                        { name: 'Popular Icons', code: 'bi-heart, bi-star, bi-check, bi-x, bi-search, bi-cart, bi-person, bi-house, bi-trash, bi-gear', description: 'Common Bootstrap icon class names' },
                        { name: 'Total Count', code: '2,000+ icons available', description: 'Free, high quality, open source icon library' }
                    ]
                }
            },
            '4.6': {
                grid: {
                    title: 'Grid System',
                    items: [
                        { name: 'Container', code: '<div class="container">...</div>', description: 'Fixed-width container' },
                        { name: 'Container Fluid', code: '<div class="container-fluid">...</div>', description: 'Full-width container' },
                        { name: 'Row', code: '<div class="row">...</div>', description: 'Wrapper for columns' },
                        { name: 'Columns', code: '<div class="col-md-6">...</div>', description: 'Breakpoints: sm, md, lg, xl' },
                        { name: 'No Gutters', code: '<div class="row no-gutters">...</div>', description: 'Remove column gutters' }
                    ]
                }
            },
            '3.4': {
                grid: {
                    title: 'Grid System',
                    items: [
                        { name: 'Container', code: '<div class="container">...</div>', description: 'Fixed-width container' },
                        { name: 'Row', code: '<div class="row">...</div>', description: 'Wrapper for columns' },
                        { name: 'Columns', code: '<div class="col-md-6">...</div>', description: 'Breakpoints: xs, sm, md, lg' },
                        { name: 'Column Offset', code: '<div class="col-md-offset-4">...</div>', description: 'Offset columns (different syntax than v5)' }
                    ]
                }
            },
            '2.3': {
                grid: {
                    title: 'Grid System',
                    items: [
                        { name: 'Container', code: '<div class="container">...</div>', description: 'Fixed-width container' },
                        { name: 'Row', code: '<div class="row">...</div>', description: 'Wrapper for columns' },
                        { name: 'Span Columns', code: '<div class="span6">...</div>', description: '12 column grid with span1-span12' },
                        { name: 'Offset', code: '<div class="offset4">...</div>', description: 'Offset columns' }
                    ]
                }
            }
        };

        const versionColors = {
            '5.3': 'bg-purple-600',
            '4.6': 'bg-blue-600',
            '3.4': 'bg-green-600',
            '2.3': 'bg-orange-600'
        };

        let currentVersion = '5.3';
        let currentCategory = 'grid';

        // Render content
        function renderContent() {
            const content = contentData[currentVersion]?.[currentCategory] || contentData['5.3'].grid;
            const container = document.getElementById('content-container');
            document.getElementById('content-title').textContent = content.title;
            document.getElementById('version-badge').textContent = `v${currentVersion}`;
            document.getElementById('cdn-version').textContent = currentVersion;
            
            const versionColor = versionColors[currentVersion];
            document.getElementById('version-badge').className = `px-4 py-1.5 ${versionColor} text-white text-sm font-medium rounded-full`;

            // Update CDN code
            document.getElementById('cdn-code').textContent = 
`<link href="https://cdn.jsdelivr.net/npm/bootstrap@${currentVersion}.0/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@${currentVersion}.0/dist/js/bootstrap.bundle.min.js"><\/script>`;

            if (!content.items || content.items.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 text-slate-500">
                        <p>Content coming soon for this section in Bootstrap ${currentVersion}</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = content.items.map((item, index) => `
                <div class="border-2 border-slate-100 rounded-lg p-5 hover:border-purple-200 hover:shadow-md transition-all animate-slide-in">
                    <div class="flex items-start justify-between mb-2">
                        <h3 class="text-lg font-semibold text-slate-900">${item.name}</h3>
                        <button data-index="${index}" class="copy-btn text-sm px-3 py-1 bg-slate-100 hover:bg-slate-200 rounded-md transition-colors">
                            Copy
                        </button>
                    </div>
                    <p class="text-sm text-slate-600 mb-3">${item.description}</p>
                    <pre class="bg-slate-900 text-slate-100 p-4 rounded-lg overflow-x-auto"><code class="text-sm">${escapeHtml(item.code)}</code></pre>
                </div>
            `).join('');
            
            // Attach event listeners to copy buttons
            document.querySelectorAll('.copy-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const index = parseInt(this.getAttribute('data-index'));
                    const code = content.items[index].code;
                    copyToClipboard(code, this);
                });
            });
        }

        // Helper function to escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Copy to clipboard
        function copyToClipboard(text, button) {
            navigator.clipboard.writeText(text).then(() => {
                const originalText = button.textContent;
                button.textContent = 'Copied!';
                button.classList.add('bg-green-100');
                setTimeout(() => {
                    button.textContent = originalText;
                    button.classList.remove('bg-green-100');
                }, 2000);
            });
        }

        // Version selector
        document.querySelectorAll('.version-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                currentVersion = btn.dataset.version;
                document.querySelectorAll('.version-btn').forEach(b => {
                    b.className = 'version-btn p-4 rounded-xl border-2 transition-all font-medium bg-white text-slate-700 border-slate-200 hover:border-slate-300';
                });
                const color = versionColors[currentVersion];
                btn.className = `version-btn p-4 rounded-xl border-2 transition-all font-medium ${color} text-white border-transparent shadow-lg scale-105`;
                renderContent();
            });
        });

        // Category selector
        document.querySelectorAll('.category-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                currentCategory = btn.dataset.category;
                const color = versionColors[currentVersion];
                document.querySelectorAll('.category-btn').forEach(b => {
                    b.className = 'category-btn w-full flex items-center gap-3 px-4 py-3 rounded-lg transition-all text-slate-700 hover:bg-slate-50';
                });
                btn.className = `category-btn w-full flex items-center gap-3 px-4 py-3 rounded-lg transition-all ${color} text-white shadow-md`;
                renderContent();
                // Close mobile menu
                document.getElementById('sidebar').classList.add('hidden');
                document.getElementById('sidebar').classList.add('lg:block');
                document.getElementById('menu-icon').classList.remove('hidden');
                document.getElementById('close-icon').classList.add('hidden');
            });
        });

        // Mobile menu toggle
        document.getElementById('mobile-menu-btn').addEventListener('click', () => {
            const sidebar = document.getElementById('sidebar');
            const menuIcon = document.getElementById('menu-icon');
            const closeIcon = document.getElementById('close-icon');
            
            sidebar.classList.toggle('hidden');
            menuIcon.classList.toggle('hidden');
            closeIcon.classList.toggle('hidden');
        });

        // Initial render
        renderContent();
    </script>
</body>
</html>
